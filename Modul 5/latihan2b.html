<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 2b - Flexbox Responsive Web</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Container Flexbox */
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }

    .box {
      background-color: #3498db;
      color: white;
      padding: 40px 20px;
      text-align: center;
      font-weight: bold;
      border-radius: 6px;
      flex: 1 1 calc(25% - 15px); 
      min-width: 200px;
    }

    @media screen and (max-width: 1024px) and (min-width: 768px) {
      .box {
        flex: 1 1 calc(50% - 15px); 
      }
    }

    @media screen and (max-width: 767px) {
      .box {
        flex: 1 1 100%; 
      }
    }
  </style>
</head>
<body>

  <h2>Latihan 2b: Halaman Responsif Menggunakan Flexbox</h2>

  <div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 1b - Media Query Logo UNS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #ffffff;
    }

    @media screen and (max-width: 428px) {
      body {
        background-color: yellow;
      }
    }

    .logo-wrapper {
      display: none;
      margin-top: 20px;
    }

    @media screen and (min-width: 1025px) {
      .logo-wrapper {
        display: block;
      }
    }

    .status-box {
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      background-color: #f8f9fa;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>Latihan 1b: Media Query & Logo UNS</h2>
  <p>Latar belakang akan berwarna kuning pada layar &le; 428px.</p>
  <p>Logo UNS di bawah ini hanya akan terlihat jika lebar layar > 1024px.</p>

  <div class="logo-wrapper">
    <img src="logo-uns.png" alt="Logo UNS" width="200" onerror="this.onerror=null; this.src='https://uns.ac.id/id/wp-content/uploads/logo-uns-png-1.png';">
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana - Latihan 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input[type="number"] {
            padding: 8px;
            margin-right: 5px;
            width: 120px;
        }
        button {
            padding: 8px 15px;
            margin-right: 5px;
            cursor: pointer;
        }
        #hasil {
            margin-top: 15px;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Kalkulator Sederhana</h2>
    <input type="number" id="angka1" placeholder="Angka pertama">
    <input type="number" id="angka2" placeholder="Angka kedua">
    <br><br>

    <button onclick="hitung('+')">Jumlah</button>
    <button onclick="hitung('-')">Kurang</button>
    <button onclick="hitung('*')">Kali</button>
    <button onclick="hitung('/')">Bagi</button>

    <h3 id="hasil">Hasil: </h3>

    <script>
        function hitung(operator) {
            let angka1 = Number(document.getElementById("angka1").value);
            let angka2 = Number(document.getElementById("angka2").value);
            let hasil;

            if (operator === '+') {
                hasil = angka1 + angka2;
            } else if (operator === '-') {
                hasil = angka1 - angka2;
            } else if (operator === '*') {
                hasil = angka1 * angka2;
            } else if (operator === '/') {
                if (angka2 === 0) {
                    hasil = "Tidak dapat dibagi dengan 0";
                } else {
                    hasil = angka1 / angka2;
                }
            }

            document.getElementById("hasil").innerHTML = "Hasil: " + hasil;
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Storage - Latihan 1</title>
</head>
<body>
    <center>
        <h1 id="namaMember">Selamat Datang, Member!</h1>
        <button onclick="gantiNama(event)">Masukkan Nama</button>
        <button onclick="hapusNama()">Hapus Member</button>
    </center>

    <script type="text/javascript">
        const namaMember = document.getElementById('namaMember');
        const namaTersimpan = localStorage.getItem('nama');
        if (namaTersimpan) {
            namaMember.innerHTML = 'Halo ' + namaTersimpan + '!';
        }

        function gantiNama(e) {
            let nama = prompt('Masukkan nama Anda:');
            if (nama && nama.trim() !== "") {
                localStorage.setItem('nama', nama);
                namaMember.innerHTML = 'Halo ' + nama + '!';
            } else if (nama !== null) {
                alert('Nama tidak boleh kosong!');
                if (e) e.preventDefault();
            }
        }

        function hapusNama() {
            if (localStorage.getItem('nama')) {
                localStorage.removeItem('nama');
                namaMember.innerHTML = 'Selamat Datang, Member!';
                alert('Data nama member berhasil dihapus!');
            } else {
                alert('Tidak ada data nama tersimpan untuk dihapus!');
            }
        }
    </script>
</body>
</html>

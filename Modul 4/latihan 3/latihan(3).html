<!DOCTYPE html>
<html>
<head>
    <title>Praktikum Layout HTML</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <div id="wrapper">
        <div id="container">
            <div id="header">
                <div id="logo">
                    <img src="../image/logo.png" alt="Logo">
                </div>
                <div id="menu">
                    <ul>
                        <li><a href="#">Beranda</a></li>
                        <li><a href="#">Profil</a></li>
                        <li><a href="#">Galeri</a></li>
                        <li><a href="#">Kontak</a></li>
                    </ul>
                </div>
            </div>

            <div id="hero">
                <img src="../image/header.png" alt="Header Image">
            </div>

            <div id="konten">
                <div id="artikelsingkat">
                    <h2>Artikel Populer</h2>
                    <p>Ini adalah bagian dari artikel singkat yang terdapat pada layout halaman web.</p>
                </div>
                <div id="galeri">
                    <h2>Galeri Foto</h2>
                    <img src="../image/konten.jpg" alt="Foto Galeri 1">
                    <img src="../image/konten2.jpg" alt="Foto Galeri 2">
                    <img src="../image/konten3.jpg" alt="Foto Galeri 3">
                </div>
            </div>

            <div id="footer">
                <p>&copy; 2026 Praktikum Web Design - All Rights Reserved.</p>
            </div>
        </div>
    </div>

</body>
</html>
